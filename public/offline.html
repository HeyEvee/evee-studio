<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Evee Studio is offline</title>
<style>
:root{--bg:#f3f0ea;--ink:#2b2420;--muted:#6e6458;--accent:#55613a}
@media (prefers-color-scheme:dark){:root{--bg:#1b1815;--ink:#f1ece4;--muted:#b2a796;--accent:#b5c27f}}
body{margin:0;min-height:100dvh;display:grid;place-content:center;gap:8px;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif;text-align:center}
b{font-size:28px;color:var(--accent)}p{margin:0;color:var(--muted)}
button{margin-top:12px;border:0;border-radius:12px;padding:12px 18px;font:600 15px system-ui;background:var(--accent);color:var(--bg)}
</style>
</head>
<body>
<b>Evee Studio</b>
<p>You’re offline. Evee needs a connection to write scripts.</p>
<button onclick="location.reload()">Try again</button>
</body>
</html>
